name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # "test" is the check that branch protection requires.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # The tests run every case on each of these; a missing interpreter only skips its target's tests.
      - name: Install Lua interpreters
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1 lua5.2 lua5.3 lua5.4 luajit

      - name: Check
        run: ./gradlew check
