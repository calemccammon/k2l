name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Every test case runs on each of these; missing interpreters are skipped, so install them all.
      - name: Install Lua interpreters
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.2 lua5.3 lua5.4 luajit

      # TEMPORARY: diagnose the compiler hanging on CI (remove before merging).
      - name: Debug compiler hang
        continue-on-error: true
        run: |
          ./gradlew -q :compiler:installDist
          mkdir -p /tmp/repro/src/greet
          printf 'import greet.greeting\n\nfun main() {\n    println(greeting())\n}\n' > /tmp/repro/src/main.kt
          printf 'package greet\n\nfun greeting() = "hello"\n' > /tmp/repro/src/greet/text.kt
          for flags in "" "--source-map"; do
            echo "=== k2l $flags"
            time timeout --signal=QUIT --kill-after=20 90 compiler/build/install/k2l/bin/k2l -o /tmp/repro/out$flags -t 5.3 $flags /tmp/repro/src; echo "exit=$?"
          done

      - name: Test (all Lua targets)
        run: ./gradlew check

      # Confirms every case's stdout.txt is what Kotlin/JVM really prints.
      - name: Kotlin/JVM oracle
        run: ./gradlew :compiler:kotlinOracle
