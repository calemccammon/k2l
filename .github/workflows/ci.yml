name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two independent jobs that run at the same time; each fails on its own failures.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Every test case runs on each of these; missing interpreters are skipped, so install them all.
      - name: Install Lua interpreters
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.2 lua5.3 lua5.4 luajit

      # Tests on every Lua target, the Gradle plugin's functional tests, spotless and detekt. --parallel runs the
      # projects' tasks side by side (the plugin's functional tests next to the compiler's tests).
      - name: Check (all Lua targets)
        run: ./gradlew check --parallel

  # Confirms every case's stdout.txt is what Kotlin/JVM really prints. Needs neither Lua nor the k2l compiler.
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Kotlin/JVM oracle
        run: ./gradlew :compiler:kotlinOracle
