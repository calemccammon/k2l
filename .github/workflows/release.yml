name: Release

# Pushing a tag such as v0.2.0 (or v0.2.0-rc1) builds, tests and publishes a GitHub Release with the CLI
# distribution. Publishing to Maven Central / the Gradle Plugin Portal is a separate, manual step: see RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Lua interpreters
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.2 lua5.3 lua5.4 luajit

      # v0.2.0 -> 0.2.0, v0.2.0-rc1 -> 0.2.0-rc1; this overrides gradle.properties for the whole build.
      - name: Derive the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Check
        run: ./gradlew check -Pversion=${{ steps.version.outputs.version }}

      - name: Build the distributions
        run: ./gradlew :compiler:distZip :compiler:distTar -Pversion=${{ steps.version.outputs.version }}

      - name: Smoke test the zip
        run: |
          mkdir smoke && cd smoke
          unzip -q ../compiler/build/distributions/k2l-${{ steps.version.outputs.version }}.zip
          cp -r ../examples/hello .
          cd hello
          ../k2l-${{ steps.version.outputs.version }}/bin/k2l --version | grep -x "k2l ${{ steps.version.outputs.version }}"
          ../k2l-${{ steps.version.outputs.version }}/bin/k2l
          cd out && lua5.4 main.lua

      - name: Checksums
        working-directory: compiler/build/distributions
        run: |
          sha256sum k2l-*.zip k2l-*.tar > SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: |
            compiler/build/distributions/k2l-*.zip
            compiler/build/distributions/k2l-*.tar
            compiler/build/distributions/SHA256SUMS
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
