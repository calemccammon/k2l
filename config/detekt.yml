# Overrides on top of detekt's default config (buildUponDefaultConfig).

style:
  # ktlint (via Spotless) owns formatting, including line length.
  MaxLineLength:
    active: false
  WildcardImport:
    # The Lua and Kotlin PSI syntax trees are used dozens of types at a time.
    excludeImports:
      - 'dev.k2l.lua.*'
      - 'org.jetbrains.kotlin.psi.*'
  MagicNumber:
    # e.g. the operator precedence table in LuaAst.kt
    ignoreEnums: true
  ReturnCount:
    max: 3
    # `?: return` guards are idiomatic in PSI code.
    excludeGuardClauses: true
    excludeReturnFromLambda: true

complexity:
  CyclomaticComplexMethod:
    # A `when` over syntax node types is a dispatch table, not branching logic.
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    # The transformer is split into one file of extension functions per language area.
    allowedFunctionsPerFile: 25
